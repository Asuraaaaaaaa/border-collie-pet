name: Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows_installer:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Validate release version
        id: version_check
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: node tools/validate-release-version.js "${{ github.ref_name }}"

      - name: Run tests
        id: tests
        run: npm test

      - name: Build and publish tagged installer
        id: tag_release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: LinePuppy ${{ github.ref_name }}
          releaseBody: Windows x64 installer. This build is unsigned, so Microsoft Defender SmartScreen may display a warning.
          releaseDraft: false
          prerelease: false

      - name: Build manual installer
        id: manual_build
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles nsis

      - name: Upload manual installer
        id: manual_artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: LinePuppy-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
