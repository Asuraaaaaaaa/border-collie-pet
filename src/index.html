<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #pet {
      position: absolute;
      left: 0;
      top: 0;
      width: 160px;
      height: 160px;
      object-fit: contain;
      cursor: grab;
    }
    #pet.flip {
      transform: scaleX(-1);
    }
    #bubble {
      position: absolute;
      display: none;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: min(200px, calc(100vw - 16px));
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      padding: 6px 10px;
      box-sizing: border-box;
      font: 12px -apple-system, "PingFang SC", sans-serif;
      line-height: 1.35;
      color: #1a1a1a;
      text-align: center;
      white-space: pre-line;
      overflow-wrap: anywhere;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      z-index: 100;
    }
    #bubble::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: rgba(255, 255, 255, 0.97);
      border-bottom: 0;
    }
    #timer {
      position: absolute;
      top: 4px;
      right: 4px;
      display: none;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 6px;
      padding: 2px 7px;
      font: 11px -apple-system, monospace;
      color: #fff;
      white-space: nowrap;
      z-index: 100;
    }
    #ctxMenu {
      position: fixed;
      display: none;
      background: rgba(245, 245, 245, 0.98);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 8px;
      padding: 4px 0;
      min-width: 150px;
      overflow-y: auto;
      overflow-x: hidden;
      box-sizing: border-box;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      z-index: 999;
      font: 13px -apple-system, "PingFang SC", sans-serif;
      color: #1a1a1a;
    }
    #ctxMenu::-webkit-scrollbar { width: 6px; }
    #ctxMenu::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 3px;
    }
    #ctxMenu .item {
      padding: 6px 16px;
      cursor: pointer;
      white-space: nowrap;
    }
    #ctxMenu .item:hover {
      background: rgba(0, 122, 255, 0.1);
    }
    #ctxMenu .sep {
      height: 1px;
      margin: 4px 0;
      background: rgba(0, 0, 0, 0.1);
    }
    #ctxMenu .check::before {
      content: "\2713  ";
      color: #34c759;
    }
    #ctxMenu .uncheck::before {
      content: "\2003  ";
    }
    #ctxMenu .has-sub::after {
      content: " \25B6";
      font-size: 9px;
      color: #888;
    }
    .submenu {
      position: fixed;
      display: none;
      background: rgba(245, 245, 245, 0.98);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 8px;
      padding: 4px 0;
      min-width: 130px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      font: 13px -apple-system, "PingFang SC", sans-serif;
      color: #1a1a1a;
      z-index: 1000;
    }
    .submenu .item { padding: 6px 16px; cursor: pointer; white-space: nowrap; }
    .submenu .item:hover { background: rgba(0, 122, 255, 0.1); }
    .submenu .sep { height: 1px; margin: 4px 0; background: rgba(0,0,0,0.1); }
    /* pomodoro inline config panel (shown inside the scrollable ctxMenu) */
    .pomo-panel { padding: 6px 14px; }
    .pomo-panel .preset-row { display: flex; gap: 4px; margin: 6px 0; }
    .pomo-panel .preset-btn {
      flex: 1; padding: 4px 0; border: 1px solid rgba(0,0,0,0.15);
      border-radius: 5px; background: #fff; font-size: 11px; cursor: pointer;
    }
    .pomo-panel .preset-btn.active { background: #007aff; color: #fff; border-color: #007aff; }
    .pomo-panel .field { margin: 8px 0; }
    .pomo-panel .field-label {
      display: flex; justify-content: space-between;
      font-size: 11px; margin-bottom: 3px; color: #555;
    }
    .pomo-panel .field-label .val { color: #007aff; font-weight: 500; }
    .pomo-panel input[type=range] { width: 100%; margin: 0; }
    .pomo-panel .select-row { margin: 8px 0; font-size: 11px; color: #555; }
    .pomo-panel .select-row select {
      width: 100%; padding: 3px 4px; margin-top: 3px;
      border: 1px solid rgba(0,0,0,0.2); border-radius: 4px; font-size: 12px;
    }
    .pomo-panel .actions { display: flex; gap: 6px; margin-top: 10px; }
    .pomo-panel .actions button {
      flex: 1; padding: 5px 0; border: 1px solid rgba(0,0,0,0.15);
      border-radius: 5px; background: #fff; font-size: 12px; cursor: pointer;
    }
    .pomo-panel .actions button.primary {
      background: #007aff; color: #fff; border-color: #007aff;
    }
    #kbPanel {
      position: fixed;
      top: 0;
      left: 0;
      width: 260px;
      height: 170px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(32, 38, 48, 0.12);
      border-radius: 12px;
      padding: 7px;
      box-sizing: border-box;
      font: 9px -apple-system, "PingFang SC", monospace;
      color: #30343b;
      overflow: visible;
      z-index: 50;
      box-shadow: 0 5px 18px rgba(24, 32, 44, 0.18);
      --pointer-offset: 50%;
    }
    #kbPanel::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background: rgba(255, 255, 255, 0.98);
      transform: rotate(45deg);
    }
    #kbPanel[data-placement="above"]::after {
      left: var(--pointer-offset);
      bottom: -6px;
      margin-left: -5px;
      border-right: 1px solid rgba(32, 38, 48, 0.12);
      border-bottom: 1px solid rgba(32, 38, 48, 0.12);
    }
    #kbPanel[data-placement="below"]::after {
      left: var(--pointer-offset);
      top: -6px;
      margin-left: -5px;
      border-left: 1px solid rgba(32, 38, 48, 0.12);
      border-top: 1px solid rgba(32, 38, 48, 0.12);
    }
    #kbPanel[data-placement="right"]::after {
      left: -6px;
      top: var(--pointer-offset);
      margin-top: -5px;
      border-left: 1px solid rgba(32, 38, 48, 0.12);
      border-bottom: 1px solid rgba(32, 38, 48, 0.12);
    }
    #kbPanel[data-placement="left"]::after {
      right: -6px;
      top: var(--pointer-offset);
      margin-top: -5px;
      border-right: 1px solid rgba(32, 38, 48, 0.12);
      border-top: 1px solid rgba(32, 38, 48, 0.12);
    }
    #kbStats {
      display: flex;
      justify-content: space-between;
      padding: 0 4px 5px;
      font-size: 11px;
      color: #1677c8;
      font-weight: 600;
    }
    #kbBoard { display: flex; flex-direction: column; gap: 1px; }
    .kb-row { display: flex; gap: 1px; }
    .kb-key {
      flex: 1;
      height: 14px;
      min-width: 0;
      background: rgba(35, 43, 55, 0.06);
      border: 1px solid rgba(35, 43, 55, 0.1);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: #626973;
      transition: background 0.05s;
      box-sizing: border-box;
    }
    .kb-key.wide-2 { flex: 2; }
    .kb-key.wide-3 { flex: 3; }
    .kb-key.wide-6 { flex: 6; }
    .kb-key.active {
      background: #4a9eff;
      color: #fff;
      border-color: #4a9eff;
      box-shadow: 0 0 8px rgba(74, 158, 255, 0.6);
    }
    #kbTop5 {
      height: 17px;
      padding: 3px 4px 1px;
      box-sizing: border-box;
      font-size: 10px;
      color: #747b85;
      white-space: nowrap;
      overflow: hidden;
    }
    #kbTop5 .hot-key {
      display: inline-block;
      margin-right: 6px;
      color: #4d5560;
    }
    #kbTop5 .hot-key .bar {
      display: inline-block;
      height: 6px;
      background: #4a9eff;
      border-radius: 2px;
      vertical-align: middle;
      margin-left: 3px;
    }
    #kbStatusRow {
      height: 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 0 4px;
      box-sizing: border-box;
      color: #737b86;
      font-size: 9px;
      white-space: nowrap;
    }
    #kbStatus {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #kbRetry {
      flex: none;
      border: 1px solid rgba(35, 43, 55, 0.16);
      border-radius: 4px;
      background: rgba(35, 43, 55, 0.06);
      color: #4d5560;
      padding: 1px 6px;
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <img id="pet" draggable="false" src="assets/idle_0.png" alt="puppy" />
  <div id="bubble"></div>
  <div id="timer"></div>
  <div id="kbPanel" style="display:none">
    <div id="kbStats">
      <span id="kbCount">0 键</span>
      <span id="kbKpm">0 键/分</span>
    </div>
    <div id="kbBoard"></div>
    <div id="kbTop5"></div>
    <div id="kbStatusRow">
      <span id="kbStatus">窗口监听</span>
      <button id="kbRetry" type="button" hidden>重试</button>
    </div>
  </div>
  <div id="ctxMenu">
    <div class="item uncheck" data-act="pomodoro" id="pomodoroItem">番茄钟</div>
    <div class="pomo-panel" id="pomoPanel" style="display:none">
      <div class="preset-row">
        <button class="preset-btn" data-preset="15">15</button>
        <button class="preset-btn active" data-preset="25">25</button>
        <button class="preset-btn" data-preset="30">30</button>
        <button class="preset-btn" data-preset="45">45</button>
        <button class="preset-btn" data-preset="60">60</button>
      </div>
      <div class="field">
        <div class="field-label">工作时长 <span class="val" id="workVal">25 分</span></div>
        <input type="range" id="pomoWork" min="5" max="90" step="5" value="25">
      </div>
      <div class="field">
        <div class="field-label">休息时长 <span class="val" id="breakVal">5 分</span></div>
        <input type="range" id="pomoBreak" min="1" max="30" step="1" value="5">
      </div>
      <div class="field">
        <div class="field-label">循环次数 <span class="val" id="roundsVal">4 轮</span></div>
        <input type="range" id="pomoRounds" min="1" max="10" step="1" value="4">
      </div>
      <div class="select-row">
        专注时宠物姿势
        <select id="pomoPose">
          <option value="lying">趴下</option>
          <option value="sit">坐着</option>
          <option value="idle">站立</option>
        </select>
      </div>
      <div class="actions">
        <button data-act="pomoCancel">取消</button>
        <button data-act="pomoStart" class="primary">开始</button>
      </div>
    </div>
    <div class="item uncheck" data-act="water" id="waterItem">喝水提醒</div>
    <div class="sep"></div>
    <div class="item" data-act="interact" id="interactItem">互动 ▶</div>
    <div id="interactPanel" style="display:none">
      <div class="item" data-act="walk">　去散步</div>
      <div class="item" data-act="run">　跑起来</div>
      <div class="item" data-act="jump">　蹦一下</div>
      <div class="item" data-act="happy">　摸摸头</div>
      <div class="item" data-act="tilt">　歪头杀</div>
      <div class="item" data-act="wag">　摇尾巴</div>
      <div class="item" data-act="sniff">　嗅一嗅</div>
      <div class="item" data-act="scratch">　挠痒痒</div>
      <div class="item" data-act="sit">　坐下</div>
      <div class="item" data-act="sleep">　去睡觉</div>
    </div>
    <div class="sep"></div>
    <div class="item" data-act="reset">回到原位</div>
    <div class="item" data-act="resetSize">重置大小</div>
    <div class="sep"></div>
    <div class="item" data-act="quit">退出</div>
  </div>
  <script type="module" src="pet.js"></script>
</body>
</html>
