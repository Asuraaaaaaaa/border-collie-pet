<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #pet {
      position: absolute;
      left: 0;
      top: 0;
      width: 160px;
      height: 160px;
      object-fit: contain;
      cursor: grab;
    }
    #pet.flip {
      transform: scaleX(-1);
    }
    #bubble {
      position: absolute;
      display: none;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      padding: 5px 12px;
      font: 12px -apple-system, "PingFang SC", sans-serif;
      color: #1a1a1a;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      z-index: 100;
    }
    #bubble::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: rgba(255, 255, 255, 0.97);
      border-bottom: 0;
    }
    #timer {
      position: absolute;
      top: 4px;
      right: 4px;
      display: none;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 6px;
      padding: 2px 7px;
      font: 11px -apple-system, monospace;
      color: #fff;
      z-index: 100;
    }
    #ctxMenu {
      position: fixed;
      display: none;
      background: rgba(245, 245, 245, 0.98);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 8px;
      padding: 4px 0;
      min-width: 150px;
      max-height: 220px;
      overflow-y: auto;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      z-index: 999;
      font: 13px -apple-system, "PingFang SC", sans-serif;
      color: #1a1a1a;
    }
    #ctxMenu::-webkit-scrollbar { width: 6px; }
    #ctxMenu::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 3px;
    }
    #ctxMenu .item {
      padding: 6px 16px;
      cursor: pointer;
      white-space: nowrap;
    }
    #ctxMenu .item:hover {
      background: rgba(0, 122, 255, 0.1);
    }
    #ctxMenu .sep {
      height: 1px;
      margin: 4px 0;
      background: rgba(0, 0, 0, 0.1);
    }
    #ctxMenu .check::before {
      content: "\2713  ";
      color: #34c759;
    }
    #ctxMenu .uncheck::before {
      content: "\2003  ";
    }
  </style>
</head>
<body>
  <img id="pet" draggable="false" src="assets/idle_0.png" alt="puppy" />
  <div id="bubble"></div>
  <div id="timer"></div>
  <div id="ctxMenu">
    <div class="item uncheck" data-act="pomodoro" id="pomodoroItem">番茄钟</div>
    <div class="item uncheck" data-act="water" id="waterItem">喝水提醒</div>
    <div class="sep"></div>
    <div class="item" data-act="walk">去散步</div>
    <div class="item" data-act="run">跑起来</div>
    <div class="item" data-act="jump">蹦一下</div>
    <div class="item" data-act="happy">摸摸头</div>
    <div class="item" data-act="tilt">歪头杀</div>
    <div class="item" data-act="wag">摇尾巴</div>
    <div class="item" data-act="sniff">嗅一嗅</div>
    <div class="item" data-act="scratch">挠痒痒</div>
    <div class="item" data-act="sit">坐下</div>
    <div class="item" data-act="sleep">去睡觉</div>
    <div class="sep"></div>
    <div class="item" data-act="reset">回到原位</div>
    <div class="item" data-act="resetSize">重置大小</div>
    <div class="sep"></div>
    <div class="item" data-act="quit">退出</div>
  </div>
  <script src="pet.js"></script>
</body>
</html>
