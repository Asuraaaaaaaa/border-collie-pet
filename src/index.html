<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    [hidden] { display: none !important; }
    #pet {
      position: absolute;
      left: 0;
      top: 0;
      width: 160px;
      height: 160px;
      max-width: calc(100vw - 4px);
      max-height: calc(100vh - 4px);
      object-fit: contain;
      cursor: grab;
    }
    #pet.flip {
      transform: scaleX(-1);
    }
    #pet.memo-due {
      animation: memo-pet-pulse 0.8s ease-in-out infinite alternate;
    }
    @keyframes memo-pet-pulse {
      from { filter: drop-shadow(0 0 2px rgba(255, 59, 48, 0.25)); }
      to { filter: drop-shadow(0 0 10px rgba(255, 59, 48, 0.95)) brightness(1.12); }
    }
    #bubble {
      position: absolute;
      display: none;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: min(200px, calc(100vw - 16px));
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      padding: 6px 10px;
      box-sizing: border-box;
      font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei UI", "PingFang SC", sans-serif;
      line-height: 1.35;
      color: #1a1a1a;
      text-align: center;
      white-space: pre-line;
      overflow-wrap: anywhere;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      z-index: 100;
    }
    #bubble::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: rgba(255, 255, 255, 0.97);
      border-bottom: 0;
    }
    #timer {
      position: absolute;
      top: 4px;
      right: 4px;
      display: none;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 6px;
      padding: 2px 7px;
      font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei UI", monospace;
      color: #fff;
      white-space: nowrap;
      z-index: 100;
    }
    #ctxMenu {
      position: fixed;
      display: none;
      background: rgba(245, 245, 245, 0.98);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 8px;
      padding: 4px 0;
      min-width: 150px;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-gutter: stable;
      overscroll-behavior: contain;
      box-sizing: border-box;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      z-index: 999;
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei UI", "PingFang SC", sans-serif;
      color: #1a1a1a;
    }
    #ctxMenu::-webkit-scrollbar { width: 6px; }
    #ctxMenu::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 3px;
    }
    #ctxMenu .item {
      padding: 6px 16px;
      cursor: pointer;
      white-space: nowrap;
    }
    #ctxMenu .item:hover {
      background: rgba(0, 122, 255, 0.1);
    }
    #ctxMenu .sep {
      height: 1px;
      margin: 4px 0;
      background: rgba(0, 0, 0, 0.1);
    }
    #ctxMenu .check::before,
    #ctxMenu .uncheck::before {
      display: inline-block;
      width: 1em;
      margin-right: 4px;
      text-align: center;
    }
    #ctxMenu .check::before {
      content: "\2713";
      color: #34c759;
    }
    #ctxMenu .uncheck::before {
      content: "";
    }
    #ctxMenu .has-sub::after {
      content: " \25B6";
      font-size: 9px;
      color: #888;
    }
    .submenu {
      position: fixed;
      display: none;
      background: rgba(245, 245, 245, 0.98);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 8px;
      padding: 4px 0;
      min-width: 130px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei UI", "PingFang SC", sans-serif;
      color: #1a1a1a;
      z-index: 1000;
    }
    .submenu .item { padding: 6px 16px; cursor: pointer; white-space: nowrap; }
    .submenu .item:hover { background: rgba(0, 122, 255, 0.1); }
    .submenu .sep { height: 1px; margin: 4px 0; background: rgba(0,0,0,0.1); }
    /* inline panels shown inside the scrollable context menu */
    .pomo-panel,
    .memo-panel,
    #characterPanel,
    #interactPanel {
      display: none;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
      overflow-x: hidden;
    }
    #characterItem {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .character-current {
      min-width: 0;
      margin-left: auto;
      color: #737373;
      font-size: 11px;
    }
    .character-panel {
      padding: 3px 10px 7px;
    }
    .character-option {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) 18px;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-width: 0;
      height: 40px;
      padding: 3px 6px;
      border: 0;
      border-radius: 5px;
      box-sizing: border-box;
      background: transparent;
      color: #222;
      font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei UI", "PingFang SC", sans-serif;
      text-align: left;
      cursor: pointer;
    }
    .character-option:hover { background: rgba(0, 122, 255, 0.08); }
    .character-option.selected { background: rgba(52, 199, 89, 0.09); }
    .character-option img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      pointer-events: none;
    }
    .character-check {
      color: #248a3d;
      font-size: 14px;
      text-align: center;
      visibility: hidden;
    }
    .character-option.selected .character-check { visibility: visible; }
    .pomo-panel { padding: 6px 14px; }
    .pomo-panel .preset-row {
      display: flex;
      min-width: 0;
      gap: 4px;
      margin: 6px 0;
    }
    .pomo-panel .preset-btn {
      flex: 1; min-width: 0; padding: 4px 0; border: 1px solid rgba(0,0,0,0.15);
      border-radius: 5px; background: #fff; font-size: 11px; cursor: pointer;
      box-sizing: border-box;
    }
    .pomo-panel .preset-btn.active { background: #007aff; color: #fff; border-color: #007aff; }
    .pomo-panel .field { margin: 8px 0; }
    .pomo-panel .field-label {
      display: flex; justify-content: space-between;
      font-size: 11px; margin-bottom: 3px; color: #555;
    }
    .pomo-panel .field-label .val { color: #007aff; font-weight: 500; }
    .pomo-panel input[type=range] {
      width: 100%; min-width: 0; max-width: 100%; margin: 0;
      box-sizing: border-box;
    }
    .pomo-panel .select-row { margin: 8px 0; font-size: 11px; color: #555; }
    .pomo-panel .select-row select {
      width: 100%; min-width: 0; max-width: 100%; padding: 3px 4px; margin-top: 3px;
      border: 1px solid rgba(0,0,0,0.2); border-radius: 4px; font-size: 12px;
      box-sizing: border-box;
    }
    .pomo-panel .actions { display: flex; min-width: 0; gap: 6px; margin-top: 10px; }
    .pomo-panel .actions button {
      flex: 1; min-width: 0; padding: 5px 0; border: 1px solid rgba(0,0,0,0.15);
      border-radius: 5px; background: #fff; font-size: 12px; cursor: pointer;
      box-sizing: border-box;
    }
    .pomo-panel .actions button.primary {
      background: #007aff; color: #fff; border-color: #007aff;
    }
    #memoItem {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr) auto;
      align-items: center;
    }
    #memoCount {
      min-width: 18px;
      margin-left: 12px;
      padding: 1px 5px;
      border-radius: 8px;
      box-sizing: border-box;
      background: #ff3b30;
      color: #fff;
      font-size: 10px;
      line-height: 16px;
      text-align: center;
    }
    .memo-panel {
      padding: 6px 12px 10px;
    }
    .memo-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
      margin-bottom: 5px;
      color: #555;
      font-size: 11px;
    }
    .memo-icon-btn {
      flex: none;
      width: 26px;
      height: 26px;
      padding: 0;
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 5px;
      box-sizing: border-box;
      background: #fff;
      color: #333;
      font: 16px/24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
    }
    .memo-icon-btn:hover { background: rgba(0, 122, 255, 0.08); }
    .memo-list {
      max-height: 190px;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .memo-empty {
      padding: 12px 4px;
      color: #888;
      font-size: 11px;
      text-align: center;
    }
    .memo-row {
      min-width: 0;
      padding: 7px 0;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
    }
    .memo-row:first-child { border-top: 0; }
    .memo-row-content {
      color: #222;
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .memo-row-time {
      margin-top: 3px;
      color: #737373;
      font-size: 10px;
    }
    .memo-row.overdue .memo-row-time {
      color: #d70015;
      font-weight: 600;
    }
    .memo-row-actions {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
      margin-top: 5px;
    }
    .memo-row-actions .memo-icon-btn {
      width: 24px;
      height: 24px;
      font-size: 13px;
      line-height: 22px;
    }
    .memo-row-actions .complete { color: #248a3d; }
    .memo-row-actions .delete { color: #d70015; }
    .memo-form {
      min-width: 0;
      padding-top: 5px;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
    }
    .memo-form-title {
      margin-bottom: 5px;
      color: #333;
      font-size: 11px;
      font-weight: 600;
    }
    .memo-form textarea,
    .memo-form input[type="datetime-local"] {
      display: block;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      border: 1px solid rgba(0, 0, 0, 0.18);
      border-radius: 5px;
      padding: 6px 7px;
      box-sizing: border-box;
      background: #fff;
      color: #222;
      font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei UI", "PingFang SC", sans-serif;
    }
    .memo-form textarea {
      height: 62px;
      margin-bottom: 6px;
      resize: none;
      line-height: 1.4;
    }
    .memo-error {
      min-height: 15px;
      margin-top: 3px;
      color: #d70015;
      font-size: 10px;
      line-height: 1.4;
    }
    .memo-form-actions {
      display: flex;
      min-width: 0;
      gap: 6px;
      margin-top: 3px;
    }
    .memo-form-actions button {
      flex: 1;
      min-width: 0;
      padding: 5px 0;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 5px;
      box-sizing: border-box;
      background: #fff;
      color: #333;
      font-size: 12px;
      cursor: pointer;
    }
    .memo-form-actions .primary {
      border-color: #007aff;
      background: #007aff;
      color: #fff;
    }
    #memoAlert {
      position: fixed;
      display: none;
      width: 280px;
      min-height: 144px;
      padding: 13px;
      border: 2px solid #ff3b30;
      border-radius: 8px;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.99);
      color: #1f1f1f;
      font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei UI", "PingFang SC", sans-serif;
      z-index: 1100;
      --pointer-offset: 50%;
      animation: memo-alert-pulse 1.1s ease-in-out infinite alternate;
    }
    @keyframes memo-alert-pulse {
      from { box-shadow: 0 4px 16px rgba(215, 0, 21, 0.3), 0 0 0 1px rgba(255, 59, 48, 0.25); }
      to { box-shadow: 0 6px 22px rgba(215, 0, 21, 0.52), 0 0 0 6px rgba(255, 59, 48, 0.16); }
    }
    #memoAlert::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      border: solid #ff3b30;
      background: #fff;
      transform: rotate(45deg);
    }
    #memoAlert[data-placement="above"]::after {
      left: var(--pointer-offset); bottom: -8px; margin-left: -7px;
      border-width: 0 2px 2px 0;
    }
    #memoAlert[data-placement="below"]::after {
      left: var(--pointer-offset); top: -8px; margin-left: -7px;
      border-width: 2px 0 0 2px;
    }
    #memoAlert[data-placement="right"]::after {
      left: -8px; top: var(--pointer-offset); margin-top: -7px;
      border-width: 0 0 2px 2px;
    }
    #memoAlert[data-placement="left"]::after {
      right: -8px; top: var(--pointer-offset); margin-top: -7px;
      border-width: 2px 2px 0 0;
    }
    .memo-alert-heading {
      color: #d70015;
      font-size: 13px;
      font-weight: 700;
    }
    #memoAlertContent {
      max-height: 88px;
      margin-top: 7px;
      overflow-y: auto;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .memo-alert-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
      color: #737373;
      font-size: 10px;
    }
    .memo-alert-actions,
    .memo-snooze-options {
      display: flex;
      min-width: 0;
      gap: 6px;
      margin-top: 10px;
    }
    .memo-alert-actions button,
    .memo-snooze-options button {
      flex: 1;
      min-width: 0;
      border: 1px solid rgba(0, 0, 0, 0.16);
      border-radius: 5px;
      padding: 6px 4px;
      box-sizing: border-box;
      background: #fff;
      color: #333;
      font-size: 11px;
      cursor: pointer;
    }
    #memoComplete {
      border-color: #248a3d;
      background: #248a3d;
      color: #fff;
    }
    .memo-snooze-options button {
      padding: 5px 2px;
      font-size: 10px;
    }
    #kbPanel {
      position: fixed;
      display: none;
      top: 0;
      left: 0;
      width: 260px;
      height: 170px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(32, 38, 48, 0.12);
      border-radius: 12px;
      padding: 7px;
      box-sizing: border-box;
      font: 9px -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei UI", "PingFang SC", monospace;
      color: #30343b;
      overflow: visible;
      z-index: 50;
      box-shadow: 0 5px 18px rgba(24, 32, 44, 0.18);
      --pointer-offset: 50%;
    }
    #kbPanel::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background: rgba(255, 255, 255, 0.98);
      transform: rotate(45deg);
    }
    #kbPanel[data-placement="above"]::after {
      left: var(--pointer-offset);
      bottom: -6px;
      margin-left: -5px;
      border-right: 1px solid rgba(32, 38, 48, 0.12);
      border-bottom: 1px solid rgba(32, 38, 48, 0.12);
    }
    #kbPanel[data-placement="below"]::after {
      left: var(--pointer-offset);
      top: -6px;
      margin-left: -5px;
      border-left: 1px solid rgba(32, 38, 48, 0.12);
      border-top: 1px solid rgba(32, 38, 48, 0.12);
    }
    #kbPanel[data-placement="right"]::after {
      left: -6px;
      top: var(--pointer-offset);
      margin-top: -5px;
      border-left: 1px solid rgba(32, 38, 48, 0.12);
      border-bottom: 1px solid rgba(32, 38, 48, 0.12);
    }
    #kbPanel[data-placement="left"]::after {
      right: -6px;
      top: var(--pointer-offset);
      margin-top: -5px;
      border-right: 1px solid rgba(32, 38, 48, 0.12);
      border-top: 1px solid rgba(32, 38, 48, 0.12);
    }
    #kbStats {
      display: flex;
      justify-content: space-between;
      padding: 0 4px 5px;
      font-size: 11px;
      color: #1677c8;
      font-weight: 600;
    }
    #kbBoard { display: flex; width: 100%; min-width: 0; flex-direction: column; gap: 1px; }
    .kb-row { display: flex; width: 100%; min-width: 0; gap: 1px; }
    .kb-key {
      flex: 1;
      height: 14px;
      min-width: 0;
      background: rgba(35, 43, 55, 0.06);
      border: 1px solid rgba(35, 43, 55, 0.1);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: #626973;
      transition: background 0.05s;
      box-sizing: border-box;
      overflow: hidden;
      white-space: nowrap;
    }
    .kb-key.wide-2 { flex: 2; }
    .kb-key.wide-3 { flex: 3; }
    .kb-key.wide-6 { flex: 6; }
    .kb-key.active {
      background: #4a9eff;
      color: #fff;
      border-color: #4a9eff;
      box-shadow: 0 0 8px rgba(74, 158, 255, 0.6);
    }
    #kbTop5 {
      height: 17px;
      padding: 3px 4px 1px;
      box-sizing: border-box;
      font-size: 10px;
      color: #747b85;
      white-space: nowrap;
      overflow: hidden;
    }
    #kbTop5 .hot-key {
      display: inline-block;
      margin-right: 6px;
      color: #4d5560;
    }
    #kbTop5 .hot-key .bar {
      display: inline-block;
      height: 6px;
      background: #4a9eff;
      border-radius: 2px;
      vertical-align: middle;
      margin-left: 3px;
    }
    #kbStatusRow {
      height: 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 0 4px;
      box-sizing: border-box;
      color: #737b86;
      font-size: 9px;
      white-space: nowrap;
    }
    #kbStatus {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #kbRetry {
      flex: none;
      border: 1px solid rgba(35, 43, 55, 0.16);
      border-radius: 4px;
      background: rgba(35, 43, 55, 0.06);
      color: #4d5560;
      padding: 1px 6px;
      font: inherit;
      cursor: pointer;
    }
    #socialPanel {
      position: fixed;
      top: 0;
      left: 0;
      display: none;
      width: 320px;
      height: 420px;
      border: 1px solid rgba(32, 38, 48, 0.14);
      border-radius: 8px;
      box-sizing: border-box;
      background: rgba(252, 252, 252, 0.99);
      color: #24272c;
      font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei UI", "PingFang SC", sans-serif;
      overflow: visible;
      z-index: 1050;
      box-shadow: 0 6px 22px rgba(24, 32, 44, 0.2);
      --pointer-offset: 50%;
    }
    #socialPanel::after {
      content: "";
      position: absolute;
      width: 11px;
      height: 11px;
      border: solid rgba(32, 38, 48, 0.14);
      background: #fcfcfc;
      transform: rotate(45deg);
    }
    #socialPanel[data-placement="above"]::after {
      left: var(--pointer-offset); bottom: -7px; margin-left: -6px;
      border-width: 0 1px 1px 0;
    }
    #socialPanel[data-placement="below"]::after {
      left: var(--pointer-offset); top: -7px; margin-left: -6px;
      border-width: 1px 0 0 1px;
    }
    #socialPanel[data-placement="right"]::after {
      left: -7px; top: var(--pointer-offset); margin-top: -6px;
      border-width: 0 0 1px 1px;
    }
    #socialPanel[data-placement="left"]::after {
      right: -7px; top: var(--pointer-offset); margin-top: -6px;
      border-width: 1px 1px 0 0;
    }
    .social-shell {
      display: grid;
      grid-template-rows: 42px minmax(0, 1fr);
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border-radius: 7px;
    }
    .social-header {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) 34px;
      align-items: center;
      min-width: 0;
      padding: 4px 7px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
      background: #f3f4f6;
    }
    #socialBack { grid-column: 1; }
    #socialTitle { grid-column: 2; }
    #socialClose { grid-column: 3; }
    .social-title {
      min-width: 0;
      overflow: hidden;
      font-size: 13px;
      font-weight: 650;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .social-icon-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #4e545d;
      font: 18px/28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
    }
    .social-icon-btn:hover { background: rgba(0, 0, 0, 0.06); }
    #socialBody {
      display: block;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    #socialMain {
      display: grid;
      grid-template-rows: minmax(0, 1fr) 44px;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
    }
    #socialAuthView,
    #socialProfileView {
      height: 100%;
    }
    .social-view {
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px;
      box-sizing: border-box;
    }
    .social-view.chat-view { padding: 0; overflow: hidden; }
    .social-tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      min-width: 0;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      background: #f6f7f8;
    }
    .social-tab {
      position: relative;
      min-width: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #70757d;
      font-size: 11px;
      cursor: pointer;
    }
    .social-tab.active { color: #0878c9; font-weight: 650; }
    .social-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 17px;
      height: 17px;
      margin-left: 5px;
      padding: 0 4px;
      border-radius: 9px;
      box-sizing: border-box;
      background: #e6342a;
      color: #fff;
      font-size: 10px;
      line-height: 17px;
    }
    #socialItem {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr) auto;
      align-items: center;
    }
    #socialUnread { margin-left: 12px; }
    .social-form {
      display: grid;
      gap: 9px;
      max-width: 280px;
      margin: 28px auto 0;
    }
    .social-lead { margin: 0 0 5px; color: #5c626a; line-height: 1.55; }
    .social-field-label { color: #5e646c; font-size: 11px; }
    .social-input,
    #socialComposer {
      width: 100%;
      min-width: 0;
      border: 1px solid rgba(0, 0, 0, 0.18);
      border-radius: 5px;
      padding: 8px 9px;
      box-sizing: border-box;
      background: #fff;
      color: #24272c;
      font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei UI", "PingFang SC", sans-serif;
      user-select: text;
      -webkit-user-select: text;
      outline: none;
    }
    .social-input:focus,
    #socialComposer:focus { border-color: #1686d9; box-shadow: 0 0 0 2px rgba(22, 134, 217, 0.1); }
    .social-primary,
    .social-secondary,
    .social-danger {
      min-height: 32px;
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 5px;
      padding: 6px 10px;
      box-sizing: border-box;
      background: #fff;
      color: #30343a;
      font-size: 12px;
      cursor: pointer;
    }
    .social-primary { border-color: #0878c9; background: #0878c9; color: #fff; }
    .social-danger { color: #c92a23; }
    .social-primary:disabled,
    .social-secondary:disabled,
    .social-danger:disabled { opacity: 0.5; cursor: default; }
    .social-actions { display: flex; gap: 7px; min-width: 0; }
    .social-actions > * { flex: 1; min-width: 0; }
    .social-error {
      min-height: 17px;
      color: #c92a23;
      font-size: 11px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .social-section-heading {
      margin: 2px 0 8px;
      color: #676d75;
      font-size: 11px;
      font-weight: 600;
    }
    .social-list { display: grid; min-width: 0; }
    .social-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-width: 0;
      min-height: 48px;
      padding: 7px 2px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.07);
      box-sizing: border-box;
    }
    .social-row-main { min-width: 0; cursor: pointer; }
    .social-row-title {
      min-width: 0;
      overflow: hidden;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .social-row-meta {
      min-width: 0;
      margin-top: 3px;
      overflow: hidden;
      color: #777d85;
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .social-empty { padding: 48px 8px; color: #858b92; text-align: center; }
    .social-code-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      margin-bottom: 12px;
      padding: 8px 0 12px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }
    #socialFriendCode { font: 650 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .social-inline-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px; margin-bottom: 13px; }
    .social-request-actions { display: flex; gap: 5px; }
    .social-request-actions button { min-height: 27px; padding: 4px 7px; }
    .social-setting-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.07);
    }
    .social-setting-row input[type="checkbox"] { width: 17px; height: 17px; accent-color: #0878c9; }
    .social-settings-form { display: grid; gap: 8px; margin-bottom: 14px; }
    #socialMessages {
      height: calc(100% - 65px);
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px;
      box-sizing: border-box;
      background: #f4f5f6;
    }
    .social-message {
      width: fit-content;
      max-width: 78%;
      margin: 5px 0;
      padding: 7px 9px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 8px 8px 8px 2px;
      box-sizing: border-box;
      background: #fff;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      user-select: text;
      -webkit-user-select: text;
    }
    .social-message.mine {
      margin-left: auto;
      border-color: rgba(8, 120, 201, 0.12);
      border-radius: 8px 8px 2px 8px;
      background: #dff1ff;
    }
    .social-message-time { margin-top: 3px; color: #82878e; font-size: 9px; text-align: right; }
    .social-composer-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 52px;
      gap: 7px;
      height: 65px;
      padding: 8px;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
      background: #fff;
    }
    #socialComposer { height: 48px; resize: none; padding: 7px; line-height: 1.35; }
    #socialSend { height: 48px; padding: 4px; }
    .social-chat-menu { display: flex; gap: 6px; margin: 8px 10px 0; }
  </style>
</head>
<body>
  <img id="pet" draggable="false" src="assets/characters/border-collie/idle_0.png" alt="边牧桌宠" />
  <div id="bubble"></div>
  <div id="timer"></div>
  <div id="kbPanel">
    <div id="kbStats">
      <span id="kbCount">0 键</span>
      <span id="kbKpm">0 键/分</span>
    </div>
    <div id="kbBoard"></div>
    <div id="kbTop5"></div>
    <div id="kbStatusRow">
      <span id="kbStatus">窗口监听</span>
      <button id="kbRetry" type="button" hidden>重试</button>
    </div>
  </div>
  <div id="socialPanel" role="dialog" aria-modal="false" aria-label="好友与消息">
    <div class="social-shell">
      <header class="social-header">
        <button id="socialBack" class="social-icon-btn" type="button" title="返回" aria-label="返回" hidden>‹</button>
        <div id="socialTitle" class="social-title">好友与消息</div>
        <button id="socialClose" class="social-icon-btn" type="button" title="关闭" aria-label="关闭">×</button>
      </header>
      <div id="socialBody">
        <section id="socialAuthView" class="social-view">
          <form id="socialEmailForm" class="social-form">
            <p class="social-lead">使用邮箱验证码登录</p>
            <label class="social-field-label" for="socialEmail">邮箱</label>
            <input id="socialEmail" class="social-input" type="email" autocomplete="email" placeholder="name@example.com">
            <button class="social-primary" type="submit">获取验证码</button>
            <div id="socialAuthError" class="social-error" aria-live="polite"></div>
          </form>
          <form id="socialOtpForm" class="social-form" hidden>
            <p id="socialOtpHint" class="social-lead"></p>
            <label class="social-field-label" for="socialOtp">6 位验证码</label>
            <input id="socialOtp" class="social-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
            <button class="social-primary" type="submit">登录</button>
            <button id="socialChangeEmail" class="social-secondary" type="button">更换邮箱</button>
            <div id="socialOtpError" class="social-error" aria-live="polite"></div>
          </form>
        </section>
        <section id="socialProfileView" class="social-view" hidden>
          <form id="socialProfileForm" class="social-form">
            <p class="social-lead">设置一个好友能认出你的昵称</p>
            <label class="social-field-label" for="socialNickname">昵称</label>
            <input id="socialNickname" class="social-input" type="text" maxlength="30" autocomplete="nickname">
            <button class="social-primary" type="submit">保存并开始使用</button>
            <div id="socialProfileError" class="social-error" aria-live="polite"></div>
          </form>
        </section>
        <main id="socialMain" hidden>
          <section id="socialConversationsView" class="social-view">
            <div id="socialConversations" class="social-list"></div>
          </section>
          <section id="socialFriendsView" class="social-view" hidden>
            <div class="social-code-row">
              <span>我的好友码</span>
              <span id="socialFriendCode">--------</span>
              <button id="socialCopyCode" class="social-icon-btn" type="button" title="复制好友码" aria-label="复制好友码">⧉</button>
            </div>
            <form id="socialFriendForm" class="social-inline-form">
              <input id="socialFriendCodeInput" class="social-input" type="text" maxlength="8" placeholder="输入 8 位好友码">
              <button class="social-primary" type="submit">添加</button>
            </form>
            <div id="socialFriendError" class="social-error" aria-live="polite"></div>
            <div class="social-section-heading">好友</div>
            <div id="socialFriends" class="social-list"></div>
          </section>
          <section id="socialRequestsView" class="social-view" hidden>
            <div id="socialRequests" class="social-list"></div>
          </section>
          <section id="socialSettingsView" class="social-view" hidden>
            <form id="socialSettingsForm" class="social-settings-form">
              <label class="social-field-label" for="socialSettingsNickname">昵称</label>
              <input id="socialSettingsNickname" class="social-input" type="text" maxlength="30">
              <label class="social-setting-row" for="socialPreviewEnabled">
                <span>桌面提醒显示消息正文</span>
                <input id="socialPreviewEnabled" type="checkbox">
              </label>
              <button class="social-primary" type="submit">保存设置</button>
              <div id="socialSettingsError" class="social-error" aria-live="polite"></div>
            </form>
            <div class="social-section-heading">已拉黑</div>
            <div id="socialBlocked" class="social-list"></div>
            <button id="socialSignOut" class="social-danger" type="button">退出登录</button>
          </section>
          <section id="socialChatView" class="social-view chat-view" hidden>
            <div id="socialMessages"></div>
            <form id="socialComposerForm" class="social-composer-row">
              <textarea id="socialComposer" maxlength="500" placeholder="输入消息" aria-label="输入消息"></textarea>
              <button id="socialSend" class="social-primary" type="submit">发送</button>
            </form>
          </section>
          <nav id="socialTabs" class="social-tabs" aria-label="好友与消息导航">
            <button class="social-tab active" type="button" data-social-view="conversations">消息</button>
            <button class="social-tab" type="button" data-social-view="friends">好友</button>
            <button class="social-tab" type="button" data-social-view="requests">申请<span id="socialRequestUnread" class="social-badge" hidden>0</span></button>
            <button class="social-tab" type="button" data-social-view="settings">设置</button>
          </nav>
        </main>
      </div>
    </div>
  </div>
  <div id="memoAlert" role="alertdialog" aria-live="assertive" aria-modal="false">
    <div class="memo-alert-heading">备忘录到期</div>
    <div id="memoAlertContent"></div>
    <div class="memo-alert-meta">
      <span id="memoAlertDue"></span>
      <span id="memoAlertQueue"></span>
    </div>
    <div class="memo-alert-actions">
      <button id="memoComplete" type="button">完成</button>
      <button id="memoSnooze" type="button" aria-expanded="false" aria-controls="memoSnoozeOptions">稍后提醒</button>
    </div>
    <div id="memoSnoozeOptions" class="memo-snooze-options" hidden>
      <button type="button" data-minutes="5">5 分钟</button>
      <button type="button" data-minutes="15">15 分钟</button>
      <button type="button" data-minutes="30">30 分钟</button>
      <button type="button" data-minutes="60">1 小时</button>
    </div>
  </div>
  <div id="ctxMenu">
    <div class="item uncheck" data-act="pomodoro" id="pomodoroItem">番茄钟</div>
    <div class="pomo-panel" id="pomoPanel">
      <div class="preset-row">
        <button class="preset-btn" data-preset="15">15</button>
        <button class="preset-btn active" data-preset="25">25</button>
        <button class="preset-btn" data-preset="30">30</button>
        <button class="preset-btn" data-preset="45">45</button>
        <button class="preset-btn" data-preset="60">60</button>
      </div>
      <div class="field">
        <div class="field-label">工作时长 <span class="val" id="workVal">25 分</span></div>
        <input type="range" id="pomoWork" min="5" max="90" step="5" value="25">
      </div>
      <div class="field">
        <div class="field-label">休息时长 <span class="val" id="breakVal">5 分</span></div>
        <input type="range" id="pomoBreak" min="1" max="30" step="1" value="5">
      </div>
      <div class="field">
        <div class="field-label">循环次数 <span class="val" id="roundsVal">4 轮</span></div>
        <input type="range" id="pomoRounds" min="1" max="10" step="1" value="4">
      </div>
      <div class="select-row">
        专注时宠物姿势
        <select id="pomoPose">
          <option value="lying">趴下</option>
          <option value="sit">坐着</option>
          <option value="idle">站立</option>
        </select>
      </div>
      <div class="actions">
        <button data-act="pomoCancel">取消</button>
        <button data-act="pomoStart" class="primary">开始</button>
      </div>
    </div>
    <div class="item uncheck" data-act="memo" id="memoItem">
      <span>备忘录</span><span id="memoCount" hidden>0</span>
    </div>
    <div class="memo-panel" id="memoPanel">
      <div class="memo-toolbar">
        <span>未完成</span>
        <button id="memoAdd" class="memo-icon-btn" type="button" title="新建备忘录" aria-label="新建备忘录">+</button>
      </div>
      <div id="memoList" class="memo-list"></div>
      <form id="memoForm" class="memo-form" hidden>
        <div id="memoFormTitle" class="memo-form-title">新建备忘录</div>
        <textarea id="memoContent" maxlength="200" placeholder="输入备忘内容" aria-label="备忘内容"></textarea>
        <input id="memoDueAt" type="datetime-local" aria-label="到期时间">
        <div id="memoError" class="memo-error" aria-live="polite"></div>
        <div class="memo-form-actions">
          <button id="memoCancel" type="button">取消</button>
          <button type="submit" class="primary">保存</button>
        </div>
      </form>
    </div>
    <div class="item uncheck" data-act="water" id="waterItem">喝水提醒</div>
    <div class="item" data-act="social" id="socialItem">
      <span>好友与消息</span><span id="socialUnread" class="social-badge" hidden>0</span>
    </div>
    <div class="item" data-act="character" id="characterItem">
      <span>宠物形象</span>
      <span class="character-current"><span id="characterName">边牧</span> ▶</span>
    </div>
    <div id="characterPanel" class="character-panel" role="radiogroup" aria-label="宠物形象">
      <button class="character-option selected" type="button" role="radio" aria-checked="true" data-character-id="border-collie">
        <img src="assets/characters/border-collie/idle_0.png" alt="">
        <span>边牧</span>
        <span class="character-check" aria-hidden="true">✓</span>
      </button>
      <button class="character-option" type="button" role="radio" aria-checked="false" data-character-id="person">
        <img src="assets/characters/person/idle_0.png" alt="">
        <span>人物</span>
        <span class="character-check" aria-hidden="true">✓</span>
      </button>
    </div>
    <div class="sep"></div>
    <div class="item" data-act="interact" id="interactItem">互动 ▶</div>
    <div id="interactPanel">
      <div class="item" data-act="walk">　去散步</div>
      <div class="item" data-act="run">　跑起来</div>
      <div class="item" data-act="jump">　蹦一下</div>
      <div class="item" data-act="happy">　摸摸头</div>
      <div class="item" data-act="tilt">　歪头杀</div>
      <div class="item" data-act="wag" id="wagAction">　摇尾巴</div>
      <div class="item" data-act="sniff" id="sniffAction">　嗅一嗅</div>
      <div class="item" data-act="scratch" id="scratchAction">　挠痒痒</div>
      <div class="item" data-act="sit">　坐下</div>
      <div class="item" data-act="sleep">　去睡觉</div>
    </div>
    <div class="sep"></div>
    <div class="item" data-act="reset">回到原位</div>
    <div class="item" data-act="resetSize">重置大小</div>
    <div class="sep"></div>
    <div class="item" data-act="quit">退出</div>
  </div>
  <script type="module" src="pet.js"></script>
</body>
</html>
