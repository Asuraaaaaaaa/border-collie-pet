<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #pet {
      position: absolute;
      left: 0;
      top: 0;
      width: 240px;
      height: 240px;
      object-fit: contain;
      cursor: grab;
    }
    #pet.flip {
      transform: scaleX(-1);
    }
    #ctxMenu {
      position: fixed;
      display: none;
      background: rgba(245, 245, 245, 0.98);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 8px;
      padding: 4px 0;
      min-width: 140px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      z-index: 999;
      font: 13px -apple-system, "PingFang SC", sans-serif;
      color: #1a1a1a;
    }
    #ctxMenu .item {
      padding: 6px 16px;
      cursor: pointer;
      white-space: nowrap;
    }
    #ctxMenu .item:hover {
      background: rgba(0, 122, 255, 0.1);
    }
    #ctxMenu .sep {
      height: 1px;
      margin: 4px 0;
      background: rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <img id="pet" draggable="false" src="assets/idle_0.png" alt="puppy" />
  <div id="ctxMenu">
    <div class="item" data-act="walk">去散步</div>
    <div class="item" data-act="run">跑起来</div>
    <div class="item" data-act="happy">摸摸头</div>
    <div class="item" data-act="sleep">去睡觉</div>
    <div class="sep"></div>
    <div class="item" data-act="reset">回到原位</div>
    <div class="sep"></div>
    <div class="item" data-act="quit">退出</div>
  </div>
  <script src="pet.js"></script>
</body>
</html>
